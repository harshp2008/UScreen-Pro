# Drop-in for uscreen.service: ~/.config/systemd/user/uscreen.service.d/10-compositor-safety.conf
# See experiments_and_findings/56_evdi_mutter_freeze_rca.md.
#
# The daemon puts a monitor on the desktop, so it must (1) start only after the
# GNOME session is initialised, (2) never compete with the compositor for CPU,
# and (3) be the first thing the OOM killer takes. `After=` in a drop-in adds to
# the unit's own ordering. The daemon additionally waits for the shell itself
# (guard.rs): shell >= 60 s old and its main loop answering quickly.
[Unit]
After=gnome-session-initialized.target
StartLimitIntervalSec=120
StartLimitBurst=4

[Service]
Nice=5
CPUWeight=50
OOMScoreAdjust=300
