# CI: builds the Linux host (daemon, pen menu, EVDI helper) and the Android APK on pushes to main and develop and on pull requests to main.
# It does not build the desktop app and does not run the installer tests (installer.yml does).
name: Build UScreen

on:
  push:
    branches: [main, develop]
    paths-ignore: ['website/**', 'docs/**', 'experiments_and_findings/**', '**/*.md']
  pull_request:
    branches: [main]
    paths-ignore: ['website/**', 'docs/**', 'experiments_and_findings/**', '**/*.md']

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-host:
    name: Build Linux host (daemon + pen menu + helper)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev \
            libdrm-dev libgtk-4-dev
          # libevdi headers are needed only for the C helper; not in all repos
          sudo apt-get install -y libevdi0-dev || echo "libevdi-dev unavailable, helper build will be skipped"

      # Caches the registry and the compiled dependencies, keyed on Cargo.lock; saved only from main so
      # pull requests read the cache without filling it with their own variants.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build daemon and pen menu
        run: cargo build --release -p uscreen -p uscreen-menu

      - name: Run tests
        run: cargo test --release -p uscreen

      - name: Build EVDI helper
        run: make build-helper || echo "Skipped (libevdi headers not available)"

      - name: Upload host binaries
        uses: actions/upload-artifact@v4
        with:
          name: uscreen-linux-x86_64
          path: |
            target/release/uscreen
            target/release/uscreen-menu

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # No SDK setup step: the hosted runners ship the Android SDK with its
      # licences accepted, and Gradle finds it through ANDROID_HOME. The
      # setup-android action started failing on the licence prompt in
      # September 2026 and took every build red with it.

      # Caches the Gradle distribution, dependencies and build cache between runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: uscreen-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
